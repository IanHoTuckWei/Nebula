<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Knowledge Evaluation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #10b981; 
            --danger: #ef4444;
            --bg-dark: #0a0a0c;
            --card-bg: #0d0d0d;
            --border-color: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        * { cursor: none !important; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #07131e 0%, #0a0e14 45%, #051d18 100%);
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot {
            width: 8px; height: 8px; background: var(--accent);
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 200001;
            transform: translate(-50%, -50%);
        }
        .cursor-outline {
            width: 40px; height: 40px; border: 2px solid rgba(16, 185, 129, 0.5);
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 200000; 
            transition: transform 0.15s ease-out, width 0.15s ease, height 0.15s ease;
            transform: translate(-50%, -50%);
        }

        /* --- GLOBAL NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 1.8rem 8%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9999;
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: white; 
        }
        .nav-logo {
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            font-size: 1.2rem;
            text-decoration: none;
        }
        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-links a { 
            text-decoration: none; 
            color: #888; 
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            transition: color 0.2s ease; 
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a.active { color: var(--accent); }

        .auth-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent) !important;
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
            transition: all 0.3s ease;
            text-decoration: none;
            cursor: pointer !important;
        }
        .auth-btn:hover {
            background: var(--accent);
            color: #000 !important;
        }

        /* --- SECTION LAYOUT --- */
        section {
            padding: 140px 8% 80px 8%;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 { font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: -2px; line-height: 1.1; margin-top: 10px; margin-bottom: 20px; }
        p.subtitle { max-width: 700px; font-size: 1.1rem; color: #a1a1aa; line-height: 1.6; }

        /* --- QUIZ CARD STYLING --- */
        .quiz-card {
            background: rgba(13, 13, 13, 0.75);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 8px;
            margin-top: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .quiz-status {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .quiz-question {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid #222;
            color: #aaa;
            padding: 20px 25px;
            text-align: left;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background: #161616;
            border-color: #444;
            color: #fff;
        }

        .option-btn.selected {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent);
            color: #fff;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            color: #fff;
        }

        .quiz-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 25px;
            margin-top: 10px;
        }

        .action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px 35px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 2px;
            transition: opacity 0.2s;
        }

        .action-btn:hover:not([disabled]) {
            opacity: 0.9;
        }

        .action-btn:disabled {
            background: #222;
            color: #555;
        }

        .score-counter {
            font-family: 'JetBrains Mono', monospace;
            color: #888;
            font-size: 0.9rem;
        }

        .feedback-box {
            margin-bottom: 25px;
            padding: 20px;
            background: #121212;
            border-left: 3px solid var(--accent);
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.6;
            display: none;
            border-radius: 0 4px 4px 0;
        }

        .feedback-box.wrong-feedback {
            border-left-color: var(--danger);
        }

        .final-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            color: var(--accent);
            margin: 20px 0;
        }

        footer { 
            padding: 60px 0; 
            text-align: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }
        @media (hover: none), (pointer: coarse) {
            .cursor-dot,
            .cursor-outline {
                display: none;
            }
        }
        @media (max-width: 768px) {
            nav {
                padding: 1rem 5%;
                flex-direction: column;
                gap: 0.9rem;
                background: rgba(0, 0, 0, 0.82);
                backdrop-filter: blur(14px);
            }
            .nav-links {
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem 1rem;
            }
            section {
                padding: 150px 5% 70px;
            }
            .quiz-card {
                padding: 24px 18px;
            }
            .quiz-question {
                font-size: 1.25rem;
            }
            .quiz-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">NEBULA</a>
        <div class="nav-links">
            <a href="origins.html">Origins</a>
            <a href="solutions.html">Solutions</a>
            <a href="history.html">History</a>
            <a href="features.html">Features</a>
            <a href="quiz.html" class="active">Quiz</a>
            <a href="events.html">Events</a>
            <a href="login.html?return=quiz.html" class="auth-btn" id="authNavBtn">LOGIN</a>
        </div>
    </nav>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <section>
        <span style="font-family: 'JetBrains Mono'; color: var(--accent); letter-spacing: 3px;">// EVALUATION_MODULE</span>
        <h1>Test Your Knowledge</h1>
        <p class="subtitle">Review facts and decisions drawn from the Origins, Solutions, and History modules.</p>

        <div class="quiz-card" id="quiz-card">
            <div class="quiz-status" id="quiz-progress">QUESTION 1 OF 20</div>
            <div class="quiz-question" id="quiz-question">Loading parameter details...</div>
            
            <div class="options-grid" id="options-container">
                </div>

            <div class="feedback-box" id="feedback-box"></div>
            
            <div class="quiz-actions">
                <span class="score-counter" id="score-counter">SCORE: 00</span>
                <button class="action-btn" id="action-btn" disabled>Submit</button>
            </div>
        </div>
    </section>

    <footer>
        <p style="font-family: 'JetBrains Mono'; color: #FFF; font-size: 0.8rem; letter-spacing: 2px;">
            © 2026 NEBULA TRADEMARK // ALL RIGHTS RESERVED
        </p>
    </footer>

    <script>
        /* --- Custom Cursor Tracking --- */
        const dot = document.querySelector('.cursor-dot');
        const outline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            outline.style.left = e.clientX + 'px';
            outline.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            outline.style.width = '32px';
            outline.style.height = '32px';
        });

        document.addEventListener('mouseup', () => {
            outline.style.width = '40px';
            outline.style.height = '40px';
        });

        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => outline.style.transform = 'translate(-50%, -50%) scale(1.3)');
            el.addEventListener('mouseleave', () => outline.style.transform = 'translate(-50%, -50%) scale(1)');
        });

        /* --- Quiz Data & State Engine --- */
        const quizData = [
            {
                question: "In what year did the Great Haze, Southeast Asia's worst environmental disaster, occur?",
                options: ["1994", "1997", "2002", "2013"],
                correctIndex: 1,
                correctExplanation: "Correct! The History page identifies 1997 as the year of the Great Haze.",
                wrongExplanation: "Not quite. The correct answer is 1997, the year of the Great Haze."
            },
            {
                question: "What treaty did ASEAN member states establish in 2002 to address transboundary haze pollution?",
                options: [
                    "Kyoto Protocol",
                    "ASEAN Agreement on Transboundary Haze Pollution",
                    "Jakarta Clean Air Accord",
                    "Borneo Fire Pact"
                ],
                correctIndex: 1,
                correctExplanation: "Correct! The 2002 milestone was the ASEAN Agreement on Transboundary Haze Pollution.",
                wrongExplanation: "Not quite. The correct answer is the ASEAN Agreement on Transboundary Haze Pollution."
            },
            {
                question: "What made the 2002 ASEAN Agreement historically significant?",
                options: [
                    "It ended all peatland fires immediately.",
                    "It became the first regional legally binding treaty of its kind.",
                    "It created the first PM2.5 sensor.",
                    "It banned all cross-border trade."
                ],
                correctIndex: 1,
                correctExplanation: "Correct! History describes it as the first regional legally binding treaty of its kind.",
                wrongExplanation: "Not quite. Its milestone was becoming the first regional legally binding treaty of its kind."
            },
            {
                question: "What PSI reading did Singapore hit during the 2013 city smog emergency?",
                options: ["250", "320", "401", "500"],
                correctIndex: 2,
                correctExplanation: "Correct! Singapore's PSI reached a record 401 in 2013.",
                wrongExplanation: "Not quite. The correct answer is 401."
            },
            {
                question: "What climate phenomenon worsened the 2015 peatland fire crisis?",
                options: ["La Nina", "El Nino", "Polar Vortex", "Monsoon reversal"],
                correctIndex: 1,
                correctExplanation: "Correct! Severe El Nino conditions prolonged the dry spell in 2015.",
                wrongExplanation: "Not quite. The correct answer is El Nino."
            },
            {
                question: "During the 2015 emergency in Central Kalimantan, how low did visibility fall?",
                options: ["Below 50 meters", "Below 200 meters", "Below 500 meters", "Below 1 kilometer"],
                correctIndex: 0,
                correctExplanation: "Correct! History states visibility dropped below 50 meters.",
                wrongExplanation: "Not quite. The correct answer is below 50 meters."
            },
            {
                question: "Which two regions were named as hotspot spike areas during the 2019 return of the smog?",
                options: ["Singapore and Penang", "Sumatra and Borneo", "Java and Bali", "Kalimantan and Bangkok"],
                correctIndex: 1,
                correctExplanation: "Correct! The History page names Sumatra and Borneo.",
                wrongExplanation: "Not quite. The hotspot spikes were recorded across Sumatra and Borneo."
            },
            {
                question: "Which pollutant is described as the most hazardous fine particulate matter during haze crises?",
                options: ["PM10", "PM2.5", "SO2", "CO2"],
                correctIndex: 1,
                correctExplanation: "Correct! Origins identifies PM2.5 as the dangerous fine particulate that penetrates deep into the lungs.",
                wrongExplanation: "Not quite. The correct answer is PM2.5."
            },
            {
                question: "Nitrogen oxides are emitted mainly by which two sources?",
                options: ["Motor vehicles and power plants", "Wetlands and rivers", "Hospitals and schools", "Wind farms and dams"],
                correctIndex: 0,
                correctExplanation: "Correct! Origins says nitrogen oxides are emitted mainly by motor vehicles and power plants.",
                wrongExplanation: "Not quite. The correct answer is motor vehicles and power plants."
            },
            {
                question: "Which gas is listed as a leading cause of acid rain when sulfur-containing fuels are burned?",
                options: ["Ammonia", "Ozone", "Sulfur dioxide", "Carbon monoxide"],
                correctIndex: 2,
                correctExplanation: "Correct! Origins identifies sulfur dioxide as a leading cause of acid rain.",
                wrongExplanation: "Not quite. The correct answer is sulfur dioxide."
            },
            {
                question: "Ammonia is released mostly from which activities?",
                options: ["Marine shipping and ports", "Agricultural activities like livestock farming and fertilizers", "Solar farms", "Household cooking only"],
                correctIndex: 1,
                correctExplanation: "Correct! Origins says ammonia mainly comes from livestock farming and fertilizers.",
                wrongExplanation: "Not quite. The correct answer is agricultural activities like livestock farming and fertilizers."
            },
            {
                question: "In the Origins module, VOCs interact with nitrogen oxides under solar radiation to multiply the formation of what?",
                options: ["Acid rain", "Ground-level ozone", "Cloudless skies", "Oxygen bubbles"],
                correctIndex: 1,
                correctExplanation: "Correct! VOCs and NOx under sunlight help form ground-level ozone.",
                wrongExplanation: "Not quite. The correct answer is ground-level ozone."
            },
            {
                question: "What pollutant is described as an industrial byproduct trapped by thermal inversions and highly carcinogenic?",
                options: ["Benzene", "Methane", "Ammonia", "Oxygen"],
                correctIndex: 0,
                correctExplanation: "Correct! Origins describes benzene that way and notes its leukemia risk.",
                wrongExplanation: "Not quite. The correct answer is benzene."
            },
            {
                question: "In the Sumatra-to-Cities pipeline, what natural system pushes particulates across the ocean toward urban centers?",
                options: ["Jet stream collapse", "Monsoon cycle", "Tidal forcing", "Polar winds"],
                correctIndex: 1,
                correctExplanation: "Correct! Origins says the Monsoon Cycle pushes particulates across the ocean.",
                wrongExplanation: "Not quite. The correct answer is the Monsoon Cycle."
            },
            {
                question: "What does a thermal inversion do in the Origins module's city pipeline explanation?",
                options: [
                    "It cools the ocean and stops haze transport.",
                    "It traps pollutants between skyscrapers and over streets.",
                    "It dissolves PM2.5 in rainwater instantly.",
                    "It creates new wetlands."
                ],
                correctIndex: 1,
                correctExplanation: "Correct! Thermal inversion traps the pollution in a dense layer over the city.",
                wrongExplanation: "Not quite. The correct answer is that it traps pollutants between skyscrapers and over streets."
            },
            {
                question: "In the Solutions page, satellite and AI monitoring systems cross-reference hotspot coordinates with what to identify responsible entities?",
                options: ["School maps", "Land concession maps", "Tourist maps", "Shipping manifests"],
                correctIndex: 1,
                correctExplanation: "Correct! The Solutions module says AI checks hotspot locations against land concession maps.",
                wrongExplanation: "Not quite. The correct answer is land concession maps."
            },
            {
                question: "What is the main purpose of building canal blocks across drained peat domes?",
                options: [
                    "To increase shipping traffic",
                    "To raise water tables and re-wet dried soil beds",
                    "To store diesel fuel",
                    "To speed up land clearing"
                ],
                correctIndex: 1,
                correctExplanation: "Correct! Solutions explains that canal blocks raise subterranean water tables and re-wet peat.",
                wrongExplanation: "Not quite. The correct answer is to raise water tables and re-wet dried soil beds."
            },
            {
                question: "Which set of pollutants do community IoT air quality nodes measure in the Solutions module?",
                options: [
                    "PM2.5, PM10, carbon monoxide, and VOCs",
                    "Only rainfall and humidity",
                    "Only temperature and sunlight",
                    "Nitrogen and oxygen only"
                ],
                correctIndex: 0,
                correctExplanation: "Correct! Solutions lists PM2.5, PM10, carbon monoxide, and VOCs.",
                wrongExplanation: "Not quite. The correct answer is PM2.5, PM10, carbon monoxide, and VOCs."
            },
            {
                question: "During severe haze, what kind of public facilities are retrofitted into positive-pressure clean-air shelters?",
                options: [
                    "Libraries, community halls, and athletic centers",
                    "Only airports",
                    "Only shopping malls",
                    "Oil refineries"
                ],
                correctIndex: 0,
                correctExplanation: "Correct! Solutions says public places like libraries, community halls, and athletic centers can be converted into clean-air shelters.",
                wrongExplanation: "Not quite. The correct answer is libraries, community halls, and athletic centers."
            },
            {
                question: "What do RSPO and FSC certifications help ensure, according to the Solutions module?",
                options: [
                    "That products are produced without deforestation, peatland destruction, or open burning",
                    "That all farms use slash-and-burn methods",
                    "That masks are filtered only for dust",
                    "That every product is manufactured locally"
                ],
                correctIndex: 0,
                correctExplanation: "Correct! Solutions says these certifications support products made without deforestation, peatland destruction, or open burning.",
                wrongExplanation: "Not quite. The correct answer is that they help ensure no deforestation, peatland destruction, or open burning."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let answered = false;
        let quizFinished = false;

        const progressEl = document.getElementById('quiz-progress');
        const questionEl = document.getElementById('quiz-question');
        const optionsContainer = document.getElementById('options-container');
        const feedbackBox = document.getElementById('feedback-box');
        const scoreCounter = document.getElementById('score-counter');
        const actionBtn = document.getElementById('action-btn');

        function renderQuestion() {
            answered = false;
            quizFinished = false;
            selectedOption = null;
            feedbackBox.style.display = 'none';
            feedbackBox.classList.remove('wrong-feedback');
            actionBtn.textContent = 'Submit';
            actionBtn.disabled = true;

            const q = quizData[currentQuestion];
            progressEl.textContent = `QUESTION ${currentQuestion + 1} OF ${quizData.length}`;
            questionEl.textContent = q.question;

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => selectOption(i));
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index) {
            if (answered) return;
            selectedOption = index;
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach((b, i) => {
                b.classList.toggle('selected', i === index);
            });
            actionBtn.disabled = false;
        }

        function submitAnswer() {
            const q = quizData[currentQuestion];
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            answered = true;

            buttons.forEach((b, i) => {
                b.disabled = true;
                if (i === q.correctIndex) {
                    b.classList.add('correct');
                } else if (i === selectedOption) {
                    b.classList.add('wrong');
                }
            });

            const isCorrect = selectedOption === q.correctIndex;
            if (isCorrect) {
                score++;
                scoreCounter.textContent = `SCORE: ${String(score).padStart(2, '0')}`;
            }

            feedbackBox.textContent = isCorrect ? q.correctExplanation : q.wrongExplanation;
            feedbackBox.classList.toggle('wrong-feedback', !isCorrect);
            feedbackBox.style.display = 'block';

            actionBtn.textContent = currentQuestion < quizData.length - 1 ? 'Next Question' : 'View Results';
            actionBtn.disabled = false;
        }

        function handleActionClick() {
            if (quizFinished) {
                restartQuiz();
                return;
            }
            if (!answered) {
                submitAnswer();
                return;
            }
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                renderQuestion();
            } else {
                renderResults();
            }
        }

        function renderResults() {
            quizFinished = true;
            progressEl.textContent = 'COMPLETE';
            feedbackBox.style.display = 'none';
            optionsContainer.innerHTML = '';

            const scoreDisplay = document.createElement('div');
            scoreDisplay.className = 'final-score';
            scoreDisplay.textContent = `${score} / ${quizData.length}`;

            const msg = document.createElement('p');
            msg.style.color = '#a1a1aa';
            msg.style.fontSize = '1.1rem';
            msg.style.lineHeight = '1.6';

            if (score === quizData.length) {
                msg.textContent = 'Perfect score! You have mastered the atmospheric crisis timeline and facts.';
            } else if (score >= quizData.length / 2) {
                msg.textContent = 'Solid work. You have a strong grasp of regional environmental records.';
            } else {
                msg.textContent = 'Worth reviewing the timeline records again—details are key to understanding the crisis.';
            }

            questionEl.innerHTML = '';
            questionEl.appendChild(scoreDisplay);
            questionEl.appendChild(msg);

            actionBtn.textContent = 'Retry Quiz';
            actionBtn.disabled = false;

            scoreCounter.textContent = `SCORE: ${String(score).padStart(2, '0')}`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            scoreCounter.textContent = 'SCORE: 00';
            renderQuestion();
        }

        actionBtn.addEventListener('click', handleActionClick);
        renderQuestion();

        function checkAuthState() {
            const authNavBtn = document.getElementById('authNavBtn');
            const activeUser = localStorage.getItem('nebula_active_user');
            if (activeUser) {
                authNavBtn.textContent = `[ ${activeUser.toUpperCase()} ]`;
                authNavBtn.href = '#';
                authNavBtn.onclick = (e) => {
                    e.preventDefault();
                    if (confirm("Disconnect session terminal?")) {
                        localStorage.removeItem('nebula_active_user');
                        checkAuthState();
                    }
                };
            } else {
                authNavBtn.textContent = 'LOGIN';
                authNavBtn.href = 'login.html?return=quiz.html';
                authNavBtn.onclick = null;
            }
        }
        checkAuthState();
    </script>
</body>
</html>
