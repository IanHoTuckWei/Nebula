<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA | Knowledge Evaluation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #10b981; 
            --danger: #ef4444;
            --bg-dark: #0a0a0c;
            --card-bg: #0d0d0d;
            --border-color: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        * { cursor: none !important; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #07131e 0%, #0a0e14 45%, #051d18 100%);
            background-attachment: fixed;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot {
            width: 8px; height: 8px; background: var(--accent);
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 200001;
            transform: translate(-50%, -50%);
        }
        .cursor-outline {
            width: 40px; height: 40px; border: 2px solid rgba(16, 185, 129, 0.5);
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 200000; 
            transition: transform 0.15s ease-out, width 0.15s ease, height 0.15s ease;
            transform: translate(-50%, -50%);
        }

        /* --- GLOBAL NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 1.8rem 8%;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9999;
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: white; 
        }
        .nav-logo {
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            font-size: 1.2rem;
            text-decoration: none;
        }
        .nav-links { display: flex; align-items: center; gap: 2rem; }
        .nav-links a { 
            text-decoration: none; 
            color: #888; 
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            transition: color 0.2s ease; 
        }
        .nav-links a:hover { color: #fff; }
        .nav-links a.active { color: var(--accent); }

        .auth-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent) !important;
            padding: 8px 18px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
            transition: all 0.3s ease;
            text-decoration: none;
            cursor: pointer !important;
        }
        .auth-btn:hover {
            background: var(--accent);
            color: #000 !important;
        }

        /* --- SECTION LAYOUT --- */
        section {
            padding: 140px 8% 80px 8%;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 { font-size: clamp(2.5rem, 6vw, 4rem); letter-spacing: -2px; line-height: 1.1; margin-top: 10px; margin-bottom: 20px; }
        p.subtitle { max-width: 700px; font-size: 1.1rem; color: #a1a1aa; line-height: 1.6; }

        /* --- QUIZ CARD STYLING --- */
        .quiz-card {
            background: rgba(13, 13, 13, 0.75);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 8px;
            margin-top: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .quiz-status {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .quiz-question {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid #222;
            color: #aaa;
            padding: 20px 25px;
            text-align: left;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem;
            border-radius: 4px;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background: #161616;
            border-color: #444;
            color: #fff;
        }

        .option-btn.selected {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(16, 185, 129, 0.05);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--accent);
            color: #fff;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            color: #fff;
        }

        .quiz-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 25px;
            margin-top: 10px;
        }

        .action-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px 35px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-radius: 2px;
            transition: opacity 0.2s;
        }

        .action-btn:hover:not([disabled]) {
            opacity: 0.9;
        }

        .action-btn:disabled {
            background: #222;
            color: #555;
        }

        .score-counter {
            font-family: 'JetBrains Mono', monospace;
            color: #888;
            font-size: 0.9rem;
        }

        .feedback-box {
            margin-bottom: 25px;
            padding: 20px;
            background: #121212;
            border-left: 3px solid var(--accent);
            font-size: 0.95rem;
            color: #aaa;
            line-height: 1.6;
            display: none;
            border-radius: 0 4px 4px 0;
        }

        .feedback-box.wrong-feedback {
            border-left-color: var(--danger);
        }

        .final-score {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            color: var(--accent);
            margin: 20px 0;
        }

        footer { 
            padding: 60px 0; 
            text-align: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">NEBULA</a>
        <div class="nav-links">
            <a href="origins.html">Origins</a>
            <a href="solutions.html">Solutions</a>
            <a href="history.html">History</a>
            <a href="features.html">Features</a>
            <a href="quiz.html" class="active">Quiz</a>
            <a href="events.html">Events</a>
            <a href="login.html?return=quiz.html" class="auth-btn" id="authNavBtn">LOGIN</a>
        </div>
    </nav>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <section>
        <span style="font-family: 'JetBrains Mono'; color: var(--accent); letter-spacing: 3px;">// EVALUATION_MODULE</span>
        <h1>Test Your Knowledge</h1>
        <p class="subtitle">Review regional timeline records, atmospheric crisis milestones, and policy interventions.</p>

        <div class="quiz-card" id="quiz-card">
            <div class="quiz-status" id="quiz-progress">QUESTION 1 OF 15</div>
            <div class="quiz-question" id="quiz-question">Loading parameter details...</div>
            
            <div class="options-grid" id="options-container">
                </div>

            <div class="feedback-box" id="feedback-box"></div>
            
            <div class="quiz-actions">
                <span class="score-counter" id="score-counter">SCORE: 00</span>
                <button class="action-btn" id="action-btn" disabled>Submit</button>
            </div>
        </div>
    </section>

    <footer>
        <p style="font-family: 'JetBrains Mono'; color: #FFF; font-size: 0.8rem; letter-spacing: 2px;">
            © 2026 NEBULA TRADEMARK // ALL RIGHTS RESERVED
        </p>
    </footer>

    <script>
        /* --- Custom Cursor Tracking --- */
        const dot = document.querySelector('.cursor-dot');
        const outline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            outline.style.left = e.clientX + 'px';
            outline.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            outline.style.width = '32px';
            outline.style.height = '32px';
        });

        document.addEventListener('mouseup', () => {
            outline.style.width = '40px';
            outline.style.height = '40px';
        });

        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mouseenter', () => outline.style.transform = 'translate(-50%, -50%) scale(1.3)');
            el.addEventListener('mouseleave', () => outline.style.transform = 'translate(-50%, -50%) scale(1)');
        });

        /* --- Quiz Data & State Engine --- */
        const quizData = [
            {
                question: "In what year did the Great Haze, Southeast Asia's worst environmental disaster occur?",
                options: ["1994", "1997", "2002", "2013"],
                correctIndex: 1,
                correctExplanation: "Correct! The 1997 Great Haze affected around 70 million people and caused an estimated $9 billion in damages.",
                wrongExplanation: "Not quite. The correct answer is 1997. The Great Haze affected around 70 million people and caused an estimated $9 billion in damages."
            },
            {
                question: "What record did Singapore's Pollutant Standards Index (PSI) hit in 2013?",
                options: ["150", "250", "401", "500"],
                correctIndex: 2,
                correctExplanation: "Correct! In 2013, Singapore's PSI reached an all-time record high of 401, prompting health warnings.",
                wrongExplanation: "Not quite. In 2013, Singapore's PSI reached an all-time record high of 401, prompting health warnings."
            },
            {
                question: "What treaty did ASEAN member nations sign in 2002 to address the haze crisis?",
                options: [
                    "The Kyoto Protocol",
                    "The ASEAN Agreement on Transboundary Haze Pollution",
                    "The Jakarta Clean Air Accord",
                    "The Borneo Fire Pact"
                ],
                correctIndex: 1,
                correctExplanation: "Correct! The ASEAN Agreement on Transboundary Haze Pollution was signed in 2002 and became the first regional treaty of its kind in the world.",
                wrongExplanation: "Not quite. The ASEAN Agreement on Transboundary Haze Pollution was signed in 2002 as the world's first regional treaty addressing transboundary haze."
            },
            {
                question: "What historic milestone was achieved by the signing of the ASEAN Agreement on Transboundary Haze Pollution in 2002?",
                options: [
                    "It completely ended regional peatland fires.",
                    "It became the first regional treaty of its kind globally.",
                    "It established a maximum API cap of 401.",
                    "It provided $9 billion in immediate environmental damages."
                ],
                correctIndex: 1,
                correctExplanation: "Correct! The agreement became the first regional treaty of its kind anywhere in the world.",
                wrongExplanation: "Not quite. It became the first regional treaty of its kind globally, marking a major milestone in regional environmental cooperation."
            },
            {
                question: "What environmental factor triggered cross-border political tensions and a spike in hotspots across Sumatra and Borneo in 2019?",
                options: [
                    "Severe dry spells",
                    "Industrial factory accidents",
                    "New air quality tracking standards",
                    "School closures lasting for weeks"
                ],
                correctIndex: 0,
                correctExplanation: "Correct! Severe dry spells caused hotspot numbers to increase across Sumatra and Borneo, leading to massive carbon emissions and cross-border political tensions.",
                wrongExplanation: "Not quite. Severe dry spells fueled fires across Sumatra and Borneo and contributed to widespread haze and political tensions."
            },
            {
                question: "Which two specific geographic areas are listed as having hotspot spikes during the 2019 'Return of the Smog'?",
                options: [
                    "Singapore and Malaysia",
                    "Southeast Asia and ASEAN",
                    "Kalimantan and Central Indonesia",
                    "Sumatra and Borneo"
                ],
                correctIndex: 3,
                correctExplanation: "Correct! The 2019 timeline states that hotspots spiked across Sumatra and Borneo due to severe dry spells.",
                wrongExplanation: "Not quite. The 2019 timeline states that hotspots spiked across these two regions due to severe dry spells."
            },
            {
                question: "Which primary fine particulate matter is most hazardous to human health during regional haze crises?",
                options: ["PM10", "PM2.5", "CO2", "SO2"],
                correctIndex: 1,
                correctExplanation: "Correct! PM2.5 consists of microscopic particles small enough to penetrate deep into the lungs and bloodstreams.",
                wrongExplanation: "Not quite. PM2.5 is the fine particulate matter primarily responsible for severe respiratory risks during haze events."
            },
            {
                question: "During the 2015 State of Emergency in Central Kalimantan, to what level did visibility drop?",
                options: ["Below 50 meters", "Below 200 meters", "Below 500 meters", "Below 1 kilometer"],
                correctIndex: 0,
                correctExplanation: "Correct! Visibility dropped below 50 meters in Central Kalimantan due to subterranean peatland fires.",
                wrongExplanation: "Not quite. Extreme smog reduced visibility to below 50 meters, severely interrupting aviation and daily life."
            },
            {
                question: "What natural climate phenomenon significantly exacerbated the prolonged dry spell and fire intensity in 2015?",
                options: ["La Niña", "El Niño", "Indian Ocean Dipole Neutral", "Polar Vortex"],
                correctIndex: 1,
                correctExplanation: "Correct! Severe El Niño conditions brought prolonged dry weather that worsened peatland ignition and fire spread.",
                wrongExplanation: "Not quite. El Niño conditions were responsible for bringing extended dry spells across the region in 2015."
            },
            {
                question: "What primary agricultural practice historically contributes most to land clearing fires in peatlands?",
                options: ["Crop Rotation", "Slash-and-Burn", "Hydroponics", "Terrace Farming"],
                correctIndex: 1,
                correctExplanation: "Correct! Slash-and-burn clearing is cheap and fast, but frequently ignites underground peat soil.",
                wrongExplanation: "Not quite. The slash-and-burn land clearing method is the primary driver of uncontrollable peatland blazes."
            },
            {
                question: "What physical characteristic makes peatland fires particularly difficult to extinguish?",
                options: [
                    "They burn underwater",
                    "They burn underground (subterranean)",
                    "They burn at temperatures exceeding 2000°C",
                    "They produce invisible smoke"
                ],
                correctIndex: 1,
                correctExplanation: "Correct! Peat fires burn underground through dense organic matter, requiring massive amounts of water to fully suppress.",
                wrongExplanation: "Not quite. Subterranean burning allows peat fires to smolder silently beneath the surface for months."
            },
            {
                question: "How many people were estimated to have been directly exposed to toxic PM2.5 levels during the 1997 disaster?",
                options: ["10 Million", "25 Million", "50 Million", "Over 70 Million"],
                correctIndex: 3,
                correctExplanation: "Correct! Over 70 million individuals across multiple nations were exposed to hazardous pollution levels in 1997.",
                wrongExplanation: "Not quite. Records estimate over 70 million people suffered direct exposure to hazardous PM2.5 levels during the crisis."
            },
            {
                question: "What modern technological infrastructure is used in 2026 to detect active hotspots in real time?",
                options: [
                    "Satellite Telemetry & IoT Sensors",
                    "Manual Ground Patrols Only",
                    "High-Altitude Weather Balloons",
                    "Acoustic Fire Detectors"
                ],
                correctIndex: 0,
                correctExplanation: "Correct! Advanced satellite telemetry combined with real-time IoT air monitoring sensors form the standard tracking protocol.",
                wrongExplanation: "Not quite. Satellite telemetry combined with IoT sensor networks provides the primary automated tracking today."
            },
            {
                question: "In what year did air pollution emergency alerts hit Singapore with a record PSI reading above 400?",
                options: ["1997", "2002", "2013", "2019"],
                correctIndex: 2,
                correctExplanation: "Correct! In June 2013, Singapore recorded a historic peak PSI of 401.",
                wrongExplanation: "Not quite. It occurred in 2013 when the PSI broke previous records and climbed to 401."
            },
            {
                question: "Estimated total economic damages caused by the 1997 Great Haze exceeded which threshold?",
                options: ["$1 Billion", "$5 Billion", "$9 Billion", "$20 Billion"],
                correctIndex: 2,
                correctExplanation: "Correct! Economic losses from healthcare costs, business shutdowns, and flight cancellations exceeded $9 billion.",
                wrongExplanation: "Not quite. Total calculated economic damage from the 1997 crisis exceeded $9 billion USD."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let answered = false;
        let quizFinished = false;

        const progressEl = document.getElementById('quiz-progress');
        const questionEl = document.getElementById('quiz-question');
        const optionsContainer = document.getElementById('options-container');
        const feedbackBox = document.getElementById('feedback-box');
        const scoreCounter = document.getElementById('score-counter');
        const actionBtn = document.getElementById('action-btn');

        function renderQuestion() {
            answered = false;
            quizFinished = false;
            selectedOption = null;
            feedbackBox.style.display = 'none';
            feedbackBox.classList.remove('wrong-feedback');
            actionBtn.textContent = 'Submit';
            actionBtn.disabled = true;

            const q = quizData[currentQuestion];
            progressEl.textContent = `QUESTION ${currentQuestion + 1} OF ${quizData.length}`;
            questionEl.textContent = q.question;

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.addEventListener('click', () => selectOption(i));
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index) {
            if (answered) return;
            selectedOption = index;
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach((b, i) => {
                b.classList.toggle('selected', i === index);
            });
            actionBtn.disabled = false;
        }

        function submitAnswer() {
            const q = quizData[currentQuestion];
            const buttons = optionsContainer.querySelectorAll('.option-btn');
            answered = true;

            buttons.forEach((b, i) => {
                b.disabled = true;
                if (i === q.correctIndex) {
                    b.classList.add('correct');
                } else if (i === selectedOption) {
                    b.classList.add('wrong');
                }
            });

            const isCorrect = selectedOption === q.correctIndex;
            if (isCorrect) {
                score++;
                scoreCounter.textContent = `SCORE: ${String(score).padStart(2, '0')}`;
            }

            feedbackBox.textContent = isCorrect ? q.correctExplanation : q.wrongExplanation;
            feedbackBox.classList.toggle('wrong-feedback', !isCorrect);
            feedbackBox.style.display = 'block';

            actionBtn.textContent = currentQuestion < quizData.length - 1 ? 'Next Question' : 'View Results';
            actionBtn.disabled = false;
        }

        function handleActionClick() {
            if (quizFinished) {
                restartQuiz();
                return;
            }
            if (!answered) {
                submitAnswer();
                return;
            }
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                renderQuestion();
            } else {
                renderResults();
            }
        }

        function renderResults() {
            quizFinished = true;
            progressEl.textContent = 'COMPLETE';
            feedbackBox.style.display = 'none';
            optionsContainer.innerHTML = '';

            const scoreDisplay = document.createElement('div');
            scoreDisplay.className = 'final-score';
            scoreDisplay.textContent = `${score} / ${quizData.length}`;

            const msg = document.createElement('p');
            msg.style.color = '#a1a1aa';
            msg.style.fontSize = '1.1rem';
            msg.style.lineHeight = '1.6';

            if (score === quizData.length) {
                msg.textContent = 'Perfect score! You have mastered the atmospheric crisis timeline and facts.';
            } else if (score >= quizData.length / 2) {
                msg.textContent = 'Solid work. You have a strong grasp of regional environmental records.';
            } else {
                msg.textContent = 'Worth reviewing the timeline records again—details are key to understanding the crisis.';
            }

            questionEl.innerHTML = '';
            questionEl.appendChild(scoreDisplay);
            questionEl.appendChild(msg);

            actionBtn.textContent = 'Retry Quiz';
            actionBtn.disabled = false;

            scoreCounter.textContent = `SCORE: ${String(score).padStart(2, '0')}`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            scoreCounter.textContent = 'SCORE: 00';
            renderQuestion();
        }

        actionBtn.addEventListener('click', handleActionClick);
        renderQuestion();

        function checkAuthState() {
            const authNavBtn = document.getElementById('authNavBtn');
            const activeUser = localStorage.getItem('nebula_active_user');
            if (activeUser) {
                authNavBtn.textContent = `[ ${activeUser.toUpperCase()} ]`;
                authNavBtn.href = '#';
                authNavBtn.onclick = (e) => {
                    e.preventDefault();
                    if (confirm("Disconnect session terminal?")) {
                        localStorage.removeItem('nebula_active_user');
                        checkAuthState();
                    }
                };
            } else {
                authNavBtn.textContent = 'LOGIN';
                authNavBtn.href = 'login.html?return=quiz.html';
                authNavBtn.onclick = null;
            }
        }
        checkAuthState();
    </script>
</body>
</html>
